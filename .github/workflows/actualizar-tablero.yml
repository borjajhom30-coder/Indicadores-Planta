name: Actualizar tablero desde OneDrive

on:
  # el disparo automatico lo hace SOLO cron-job.org (llamando a este mismo
  # evento por la API de GitHub) -- no usamos el "schedule" interno de GitHub
  # porque no es confiable y podia chocar con cron-job.org.
  workflow_dispatch:

permissions:
  contents: write

# Solo una corrida a la vez. Si GitHub se atrasa y se acumulan avisos de
# cron-job.org, no corren todas en paralelo (se pisarian al guardar el
# tablero): la que esta en curso termina, y solo queda esperando la mas
# reciente. Las intermedias se cancelan solas (no cuentan como "fallidas").
concurrency:
  group: actualizar-tablero
  cancel-in-progress: false

jobs:
  actualizar:
    # Version fija de Ubuntu: GitHub va a cambiar "ubuntu-latest" a Ubuntu 26
    # el 19-oct-2026. Fijando la 24.04 evitamos sorpresas con ese cambio.
    runs-on: ubuntu-24.04
    # Si por algo el robot se queda trabado ya corriendo, no lo dejamos
    # colgado: se corta a los 5 minutos (normalmente tarda ~30 segundos).
    timeout-minutes: 5
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests openpyxl

      - name: Ejecutar el robot (descarga el Excel y regenera el tablero)
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ONEDRIVE_USER_EMAIL: ${{ secrets.ONEDRIVE_USER_EMAIL }}
          EXCEL_FILE_NAME: "Indicadores de empacadora"
        run: python update_dashboard.py

      - name: Publicar el tablero actualizado (si cambió algo)
        run: |
          git config user.name "Robot del tablero"
          git config user.email "robot@agricolaguapa.local"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sin cambios nuevos en el Excel — no hay nada que publicar."
          else
            git commit -m "Actualización automática del tablero"
            git push
          fi
