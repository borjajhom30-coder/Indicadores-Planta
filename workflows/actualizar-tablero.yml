name: Actualizar tablero desde OneDrive

on:
  # corre solo, cada 5 minutos (el minimo que permite GitHub gratis)
  schedule:
    - cron: "*/5 * * * *"
  # además, deja un botón "Run workflow" en GitHub para probarlo cuando quieras
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests openpyxl

      - name: Ejecutar el robot (descarga el Excel y regenera el tablero)
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ONEDRIVE_USER_EMAIL: ${{ secrets.ONEDRIVE_USER_EMAIL }}
          EXCEL_FILE_NAME: "Indicadores_de_empacadora"
        run: python update_dashboard.py

      - name: Publicar el tablero actualizado (si cambió algo)
        run: |
          git config user.name "Robot del tablero"
          git config user.email "robot@agricolaguapa.local"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sin cambios nuevos en el Excel — no hay nada que publicar."
          else
            git commit -m "Actualización automática del tablero"
            git push
          fi
